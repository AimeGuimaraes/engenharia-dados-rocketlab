resources:
  jobs:
    cinedata_analytics_pipeline:
      name: cinedata_analytics_pipeline
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: DAYS
      tasks:
        - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/aime.guimar@gmail.com/engenharia-dados-rocketlab/notebooks/Landing_to_Bronze
            source: WORKSPACE
        - task_key: to_Silver
          depends_on:
            - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/aime.guimar@gmail.com/engenharia-dados-rocketlab/notebooks/Bronze_to_Silver
            source: WORKSPACE
        - task_key: to_Gold
          depends_on:
            - task_key: to_Silver
          notebook_task:
            notebook_path: /Workspace/Users/aime.guimar@gmail.com/engenharia-dados-rocketlab/notebooks/Silver_to_Gold
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
